# Evinki platform: database + API + web. Everything secret comes from .env (see .env.example).
name: evinki

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evinki
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: evinki
      TZ: Asia/Tehran
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evinki -d evinki"]
      interval: 5s
      timeout: 3s
      retries: 20
    # loopback only: for `make shell-db` and importers on this host, never the internet.
    # DB_HOST_PORT is picked automatically when 15432 is taken by another project.
    ports: ["127.0.0.1:${DB_HOST_PORT:-15432}:5432"]

  api:
    image: evinki-api:latest
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://evinki:${DB_PASSWORD}@db:5432/evinki?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      CORS_ORIGINS: ${PUBLIC_URL}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-zarinpal}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_USERNAME: ${SMS_USERNAME:-}
      SMS_PASSWORD: ${SMS_PASSWORD:-}
      LEGACY_DEVICE_KEY_SECRET: ${LEGACY_DEVICE_KEY_SECRET:-}
      UPDATES_DIR: /data/updates
    # uploaded image bundles wait in the "updates" volume for scripts/updater.sh (which reads it from the host)
    volumes: [uploads:/data/uploads, updates:/data/updates]
    # lets importers reach a database on this host as host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]

  web:
    image: evinki-web:latest
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    # 127.0.0.1 by default: the host nginx (TLS) is the public entry point
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"]

volumes:
  db_data:
  uploads:
  updates:

# Serves the web app and proxies /api to the Go server: one origin, no CORS.
# A TLS-terminating nginx on the host (scripts/bootstrap-vps.sh) sits in front of this one.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # the image-bundle upload of System > Update: big, streamed straight through, slow links allowed
  location = /api/v1/admin/system/update {
    client_max_body_size 3g;
    proxy_request_buffering off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
    client_body_timeout 2700s;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 90s;
  }

  # hashed build assets never change; the HTML shell must always be revalidated
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
